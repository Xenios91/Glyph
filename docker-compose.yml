# Note: the image is "API/UI only" (no bundled JDK/Ghidra). For decompilation,
# run Glyph where a JDK + Ghidra 12.0+ + pyghidra are available and
# GHIDRA_INSTALL_DIR is set (see the Dockerfile header). Rate limiting is
# in-memory (slowapi), so no external cache/queue service is required.
services:
  glyph:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GLYPH_VERSION: "0.3.0"
    container_name: glyph
    restart: unless-stopped
    ports:
      - "${GLYPH_PORT:-8000}:8000"
    environment:
      - GLYPH_ENV=${GLYPH_ENV:-production}
      - GLYPH_JWT_SECRET_KEY=${GLYPH_JWT_SECRET_KEY:-}
      - GLYPH_CPU_CORES=${GLYPH_CPU_CORES:-4}
      - GLYPH_MAX_FILE_SIZE_MB=${GLYPH_MAX_FILE_SIZE_MB:-100}
      - GLYPH_USE_HTTPS=${GLYPH_USE_HTTPS:-false}
      - TZ=${TZ:-UTC}
    volumes:
      - ./binaries:/app/binaries
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
