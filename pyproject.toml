[project]
name = "glyph"
dynamic = ["version"]
description = "Architecture-independent binary analysis tool using NLP for function fingerprinting"
readme = "README.md"
license = {file = "license.md"}
requires-python = ">=3.11"
authors = [
    {name = "Glyph Team"}
]
keywords = ["binary-analysis", "malware", "reversing", "nlp", "machine-learning", "ghidra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "uvloop>=0.22.1",
    "Jinja2>=3.1.6",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "PyYAML>=6.0.3",
    "python-magic>=0.4.27",
    "loguru>=0.7.3",
    "asgi-correlation-id>=4.3.4",
    "slowapi>=0.1.9",
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "aiosqlite>=0.22.1",
    "joserfc>=0.11.0",
    "SQLAlchemy>=2.0.48,<2.2",
    "email-validator>=2.3.0",
    "rich>=15.0.0",
    "sentry-sdk>=2.63.0",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.15.19",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest-xdist>=3.6.0",
]
test = [
    "playwright>=1.60.0",
    "pytest-playwright>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/glyph-ml/glyph"
Repository = "https://github.com/glyph-ml/glyph"
Documentation = "https://github.com/glyph-ml/glyph/docs"
Issues = "https://github.com/glyph-ml/glyph/issues"

[project.scripts]
glyph = "main:create_app"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
package-dir = {app = "app"}

[tool.setuptools.dynamic]
version = {attr = "app._version.__version__"}

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "F401",  # unused imports (common in __init__.py)
    "B008",  # FastAPI Depends()/File()/Query()/Form() in defaults is intentional
    "B904",  # exception chain 'from' is cosmetic for now
    "E701",  # multiple statements on one line (pre-existing style)
    "N815",  # mixedCase class vars (pre-existing, would be breaking change)
    "N818",  # Exception naming convention (RequestBodyTooLarge is descriptive)
    "PLC0415",  # lazy imports are intentional to break circular deps / defer heavy loads
    "RUF012",  # mutable class attribute default (intentional constants)
    "SIM105",  # suggests sys.exit() over raise SystemExit
    "SIM116",  # suggests dict.get() over if-else (pre-existing style)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["T20", "S101", "E402", "SIM117", "B017", "RUF003", "F841", "N806", "N801", "RUF100", "RUF013"]
"app/processing/ghidra_processor.py" = ["N806"]  # PyGhidra Java interop class names
"app/stubs/**" = ["N802"]  # PyGhidra Java interop stubs match Java method names
"app/api/v1/endpoints/status.py" = ["N811"]  # UUID type alias imported as non-constant
"app/config/settings.py" = ["N806"]  # _DEFAULT_JWT_SECRET follows module-level convention
"app/api/**/endpoints/*.py" = ["ARG001"]  # FastAPI auth deps (current_user, request) often unused


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
plugins = ["pydantic.mypy"]
exclude = ["tests/e2e", "app/stubs"]
mypy_path = "app/stubs"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
    "joserfc.*",
    "slowapi.*",
    "loguru.*",
    "asgi_correlation_id.*",
    "playwright.*",
    "pandas",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.utils.logging_utils", "app.utils.logging_config"]
disable_error_code = ["misc", "arg-type"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "--strict-markers --tb=short -v --ignore=tests/e2e --timeout-method=thread --cov=app --cov-report=term-missing --cov-report=html:htmlcov"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 30
timeout_func_only = false
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "e2e: marks tests as end-to-end tests requiring Playwright",
    "auth: marks tests related to authentication",
    "security: marks tests related to security features",
    "regression: marks tests as regression tests for known bugs",
    "xdist_group: marks tests as belonging to an xdist group for coordinated scheduling",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/stubs/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "abc.abstractmethod",
]
show_missing = true
fail_under = 70

[tool.coverage.xml]
output = "coverage.xml"
