{# Token Display Component
# Usage:
#   {% include 'components/token_display.html' with {
#     'tokens': tokens,
#     'title': 'Function Tokens',
#     'id': 'tokens-display'
#   } %}
#}
<div class="cyber-container is-rounded white-bg token-scroll token-display-block">
    {% if title %}
    <p class="title">{{ title }}</p>
    {% endif %}
    <pre id="{{ id | default('tokens-display') }}">{{ tokens }}</pre>
</div>
